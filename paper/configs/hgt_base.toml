# ============================================================================
# Base Configuration for HGT (Geopotential Height) Forecasting Experiments
# Paper: Linear Attention Architectures for Geopotential Height Forecasting
# ============================================================================
# This base config defines shared parameters. Model-specific configs override
# the model.config field.
# ============================================================================

[job]
dump_folder = "exp/paper_hgt"
print_args = true

[model]
# Override in model-specific configs
config = "configs/gla_340M.json"
tokenizer_path = "fla-hub/gla-1.3B-100B"

[training]
# Data configuration
data_files = "/path/to/hgt_all_new.npy"  # UPDATE THIS PATH
input_len = 6           # 6 timesteps input (36 hours at 6-hourly data)
target_len = 4          # 4 timesteps output (24 hours forecast)
stride = 1              # Sliding window stride
levels = 7              # 500 hPa level (index 7)
dataset_split = "train"

# Batch and sequence configuration
batch_size = 8
seq_len = 2048
context_len = 2048
gradient_accumulation_steps = 1

# Training duration
steps = 50000           # Total training steps

# Optimization
max_norm = 1.0          # Gradient clipping
skip_nan_inf = true     # Skip NaN/Inf gradients
seed = 42               # Random seed for reproducibility

# Parallelism (single GPU default, scale as needed)
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
disable_loss_parallel = true

# Compilation
compile = true

# Data loading
num_workers = 4
pin_memory = true
persistent_workers = false
prefetch_factor = 2

[optimizer]
name = "AdamW"
lr = 3e-4
eps = 1e-15
# beta1 = 0.9  (default)
# beta2 = 0.999 (default)

[lr_scheduler]
warmup_steps = 1000
decay_type = "cosine"
lr_min = 0.1            # Minimum LR as fraction of peak

[checkpoint]
enable_checkpoint = true
folder = "checkpoint"
interval_type = "steps"
interval = 2500         # Save every 2500 steps
model_weights_only = false
export_dtype = "float32"
async_mode = "disabled"
load_step = -1          # -1 = don't load, or specify step to resume

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 1000

[metrics]
log_freq = 10           # Log every 10 steps
enable_wandb = true
enable_tensorboard = true

[experimental]
context_parallel_degree = 1
pipeline_parallel_degree = 1

[float8]
enable_fsdp_float8_all_gather = false
precompute_float8_dynamic_scale_for_fsdp = false

[activation_checkpoint]
mode = "none"
