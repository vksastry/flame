# ============================================================================
# GLA (Gated Linear Attention) Configuration for HGT Forecasting
# Paper: Linear Attention Architectures for Geopotential Height Forecasting
# ============================================================================

[job]
dump_folder = "exp/paper_hgt/gla_340M"
print_args = true
description = "GLA for HGT forecasting"

[model]
config = "configs/gla_340M.json"
tokenizer_path = "fla-hub/gla-1.3B-100B"

[training]
data_files = "/path/to/hgt_all_new.npy"
input_len = 6
target_len = 4
stride = 1
levels = 7
dataset_split = "train"
batch_size = 8
seq_len = 2048
context_len = 2048
gradient_accumulation_steps = 1
steps = 50000
max_norm = 1.0
skip_nan_inf = true
seed = 42
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
disable_loss_parallel = true
compile = true
num_workers = 4
pin_memory = true
persistent_workers = false
prefetch_factor = 2

[optimizer]
name = "AdamW"
lr = 3e-4
eps = 1e-15

[lr_scheduler]
warmup_steps = 1000
decay_type = "cosine"
lr_min = 0.1

[checkpoint]
enable_checkpoint = true
folder = "checkpoint"
interval_type = "steps"
interval = 2500
model_weights_only = false
export_dtype = "float32"
async_mode = "disabled"
load_step = -1

[metrics]
log_freq = 10
enable_wandb = true
enable_tensorboard = true

[experimental]
context_parallel_degree = 1
pipeline_parallel_degree = 1

[activation_checkpoint]
mode = "none"
